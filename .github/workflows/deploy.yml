name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
        
      - name: Test
        run: npm test
        
      - name: Build library
        run: npm run build:lib

      - name: Verify npm package
        run: npm run verify:package

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium-firefox-webkit

      - name: Install browsers for cross-engine smoke tests
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test packaged ESM and UMD Workers in Chromium
        run: npm run test:package-workers

      - name: Test packaged ESM and UMD Workers in Firefox
        run: npm run test:package-workers:firefox

      - name: Test packaged ESM and UMD Workers in WebKit
        run: npm run test:package-workers:webkit

      - name: Build site
        run: npm run build

      - name: Test browser downloads with resizable buffers
        run: npm run test:browser

      - name: Test browser downloads with chunk fallback
        run: npm run test:browser:fallback

      - name: Test Firefox downloads with resizable buffers
        run: npm run test:browser:firefox

      - name: Test Firefox downloads with chunk fallback
        run: npm run test:browser:firefox:fallback

      - name: Test WebKit downloads with resizable buffers
        run: npm run test:browser:webkit

      - name: Test WebKit downloads with chunk fallback
        run: npm run test:browser:webkit:fallback

      - name: Setup Pages
        uses: actions/configure-pages@v6
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
